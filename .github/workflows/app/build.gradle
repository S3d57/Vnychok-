plugins { id 'com.android.application' }
android {
    namespace 'ru.vnuchok.app'
    compileSdk 34
    defaultConfig {
        applicationId 'ru.vnuchok.app'
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources { excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE','META-INF/LICENSE.txt','META-INF/NOTICE','META-INF/NOTICE.txt'] }
    }
}
dependencies {
    implementation 'com.alphacephkni:vosk-android:0.3.45'
}
